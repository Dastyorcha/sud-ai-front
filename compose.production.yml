name: sud-ai-front

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:?VITE_API_ORIGIN is required}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    image: sud-ai-front:latest
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
